name: Build static website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check content.js
      - run: node --check sections.js
      - run: node --check pagination.js
      - run: node --check typography.js
      - run: node --check photo-presentation.js
      - run: node scripts/check-typography.mjs
      - run: node scripts/check-motion.mjs
      - run: node scripts/build.mjs
